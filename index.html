<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="/musinsa/css/reset.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css'/>

    <style>

        div.characterProfile{
            width:100%;
            height:auto;
            background:white;
        }
        div.borowserUi{
            width:100%;
            height:56px;
            border-bottom:solid 1px black;
        }
        div.borowserUi_top{
            width:100%;
            height:28px;
            display:flex;
            flex-wrap:wrap;
            flex-direction:row;
            justify-content:space-between;
            align-items:center;
            background:black;
        }
        div.id{
            width:30.48vw;
            height:100%;
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
            position:relative;
            border-right:solid 1px white;
        }
        div.id p{
            font:400 12px 'Pretendard';
            color:white;
        }
        div.id span{
            width:6px;
            height:6px;
            position:absolute;
            right:8px;
            background:url('/aiChat/images/iconCloseTab.png') no-repeat center center;
            background-size:contain;
            display:inline-block;
        }
        div.borowserUi_btn{
            width:auto;
            height:100%;
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
        }
        div.borowserUi_btn div{
            width:13.41vw;
            height:100%;
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
            border-left:solid 1px white;
        }
        span.hiddenBtn{
            width:12px;
            height:2px;
            background:url('/aiChat/images/iconHidden.png') no-repeat center center;
            background-size:contain;
        }
        span.zoomBtn{
            width:12px;
            height:12px;
            background:url('/aiChat/images/iconZoom.png') no-repeat center center;
            background-size:contain;
        }
        span.closeBtn{
            width:12px;
            height:12px;
            background:url('/aiChat/images/iconClose.png') no-repeat center center;
            background-size:contain;
        }
        div.borowserUi_bottom{
            width:100%;
            height:28px;
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
        }
        div.borowserUi_bottom div{
            width:97.56vw;
            height:20px;
            display:flex;
            flex-direction:row;
            align-items:center;
            background:black;
        }
        div.borowserUi_bottom div p{
            font:400 10px 'Pretendard';
            color:white;
            padding-left:16px;
        }

        /* div{
            width:100%;
            height:auto;
            display:flex;
            flex-direction:row;
            align-items:flex-start;
            justify-content:center;
        }
        div img{
            width:328px;
            height:auto;
            display:block;
        } */

    </style>

</head>
<body>
    <div class="characterProfile">
        <div class="borowserUi">
            <div class="borowserUi_top">
                <div class="id">
                    <p>@Navillera</p>
                    <span></span>
                </div>
                <div class="borowserUi_btn">
                    <div><span class="hiddenBtn"></span></div>
                    <div><span class="zoomBtn"></span></div>
                    <div><span class="closeBtn"></span></div>
                </div>
            </div>
            <div class="borowserUi_bottom">
                <div><p>https://www.CharacterProfile.com/</p></div>
            </div>
        </div>
        <div class="template">
            <div></div>
        </div>
    </div>

    <!-- <div>
        <img src="https://green0607.dothome.co.kr/aiChat/" alt="캐릭터소개">
    </div> -->

</body>

</html>
